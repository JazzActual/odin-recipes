<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thousand Island Dressing</title>
</head>
<body>
    <h1>Thousand Island Dressing</h1>
    <img src="../images/thousandisland.jpg" height="400" alt="thousand island dressing in a jar">
    <figcaption>Delicious homemade thousand island dressing</figcaption>
    <h3>Ingredients</h3>
    <ul>
        <li>1 cup mayonaise</li>
        <li>1 cup sweet pickle relish</li>
        <li>1/2 cup ketchup</li>
        <li>1 pinch of salt</li>
        <li>1 pinch ground black pepper</li>
    </ul>
    <h3>Steps</h3>
    <ol>
        <li>Mix together mayo, relish, ketchup, salt, and pepper in a bowl until thoroughly combined</li>
        <li>Serve and enjoy!</li>
    </ol>
</body>
</html>
